<rect x="913" y="126" width="244" height="39" rx="8" fill="#00D9FF" opacity=".14"/>
<text x="932" y="151" fill="#83E8ED" font-family="monospace" font-size="19">Dockerfile</text>
<text x="923" y="210" fill="#D5F8FF" font-family="monospace" font-size="19">COPY . /app</text>
<rect x="915" y="235" width="242" height="57" rx="9" fill="#F58B75" opacity=".12"/>
<text x="927" y="270" fill="#FFB5A1" font-family="monospace" font-size="20">! .env.production</text>
